[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/rustgis", "apps/rustgis-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/opengeos/RustGIS"

[workspace.dependencies]
# internal
rustgis-geom = { path = "crates/geom" }
rustgis-data = { path = "crates/data" }
rustgis-map = { path = "crates/map" }
rustgis-analysis = { path = "crates/analysis" }
rustgis-render = { path = "crates/render" }
rustgis-engine = { path = "crates/engine" }
rustgis-ui-egui = { path = "crates/ui-egui" }
rustgis-geolibre = { path = "crates/geolibre" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# std::time that also works in the browser (std panics on wasm32-unknown-unknown).
web-time = "1"

# geo / formats / rendering
geo = "0.33"
shapefile = "0.9"
csv = "1"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
# Rasters: GeoTIFF decoding/encoding, and coordinate systems by EPSG code (all pure Rust, so the
# browser build keeps working).
tiff = "0.11"
proj4rs = { version = "0.2", default-features = false }
crs-definitions = { version = "0.6", default-features = false, features = ["proj4"] }
base64 = "0.22"
# Deflate for PDF image streams.
miniz_oxide = "0.8"
epaint_default_fonts = "0.36"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
