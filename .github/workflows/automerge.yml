name: Auto-merge

# A maintainer labels a pull request `automerge`: it's approved and squash-merged as soon as the
# checks the `main` ruleset requires pass. A later push drops the label and turns auto-merge off,
# so new commits need another look; removing the label turns it off too.
#
# `pull_request_target` so fork pull requests get the token; the pull request's code is never
# checked out or run. The token is a maintainer's (`AUTOMERGE_TOKEN`), not GITHUB_TOKEN: Actions
# can't approve pull requests here, and a merge made with GITHUB_TOKEN wouldn't start the
# workflows that run on pushes to `main`.

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize]

permissions: {}

# One group per action: a pending run is replaced by the next one in its group, so a push's revoke
# run mustn't share a group with runs for other labels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action }}

jobs:
  enable:
    name: Enable auto-merge
    if: github.event.action == 'labeled' && github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Both pinned to the commit that was labelled: a push in between isn't approved or merged.
          # Approving fails on the token owner's own pull requests, which they can merge anyway.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" -f commit_id="$SHA" -f event=APPROVE \
            --silent || echo "Not approved."
          gh pr merge "$PR" --auto --squash --match-head-commit "$SHA"

  revoke:
    name: Revoke auto-merge
    if: >-
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'automerge'))
      || (github.event.action == 'unlabeled' && github.event.label.name == 'automerge')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
        run: |
          gh pr merge "$PR" --disable-auto || echo "Auto-merge was off."
          if [ "$ACTION" = synchronize ]; then gh pr edit "$PR" --remove-label automerge; fi
