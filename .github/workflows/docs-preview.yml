# Builds the docs and the web app on every pull request and publishes a preview to GitHub Pages:
# the `gh-pages` branch of opengeos/rustgis-preview, a folder per pull request
# (https://preview.rustgis.app/pr-<N>/, the app under app/). The branch's CNAME file, kept by every
# publish, holds the domain. GitHub Pages takes files up to 100 MB; Cloudflare Pages, used before,
# stopped at 25 MiB, which the app's WebAssembly reaches.
#
# Required repository secret:
#   PREVIEW_DEPLOY_KEY - private half of an SSH deploy key with write access to
#                        opengeos/rustgis-preview
#
# The build job runs the pull request's code with no secrets and hands the site over as an
# artifact; the publishing jobs hold the key and run no PR code. Fork and Dependabot pull
# requests get no secrets, so they build but don't deploy. A closed pull request's preview is
# removed.
name: docs-preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Build docs with Zensical
        run: |
          uv venv --python 3.12
          uv pip install -r requirements_docs.txt
          .venv/bin/zensical build
          # The preview is not the production site.
          rm -f site/CNAME
      # Production serves the app from web.rustgis.app (web-deploy.yml); previews include it
      # at /app/ so a pull request's web build can be tried before merging.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the web app
        run: |
          # Pinned Trunk release, checksum-verified, installed outside root-owned directories.
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin" trunk
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd apps/rustgis-web
          trunk build --release --public-url ./
          mkdir -p ../../site/app
          cp -r ../../dist/web/. ../../site/app/

      - uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: site
          retention-days: 3

  preview:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    env:
      HAS_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-site
          path: site

      - name: Check the site's file sizes
        run: |
          set -euo pipefail
          oversized=$(find site -type f -size +95M -print)
          if [ -n "$oversized" ]; then
            echo "::error::A file is near or over GitHub Pages' 100 MB per-file limit: $oversized"
            exit 1
          fi
          echo "Site: $(du -sh site | cut -f1); largest file: $(find site -type f -printf '%s %p\n' | sort -n | tail -1)"

      - name: Configure the preview repository deploy key
        if: env.HAS_KEY == 'true'
        env:
          PREVIEW_DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_DEPLOY_KEY" > "$HOME/.ssh/rustgis-preview"
          chmod 600 "$HOME/.ssh/rustgis-preview"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish to GitHub Pages
        id: deploy
        if: env.HAS_KEY == 'true'
        env:
          MODE: deploy
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/rustgis-preview -o IdentitiesOnly=yes
        run: &publish |
          set -euo pipefail
          dir="pr-${PR}"
          # Every publish rewrites gh-pages as one parentless commit holding the open pull
          # requests' previews, so the repository stays near the size of the live previews.
          # Publishes for different pull requests can meet: a push that lost the race starts over.
          for attempt in 1 2 3 4 5 6; do
            rm -rf pages
            git clone -q --depth 1 --branch gh-pages git@github.com:opengeos/rustgis-preview.git pages
            base=$(git -C pages rev-parse HEAD)
            rm -rf "pages/${dir}"
            if [ "$MODE" = deploy ]; then
              cp -r site "pages/${dir}"
            fi
            touch pages/.nojekyll
            git -C pages config user.name "github-actions[bot]"
            git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C pages checkout -q --orphan snapshot
            git -C pages add -A
            git -C pages commit -q --allow-empty -m "${MODE} ${dir} (${HEAD_SHA:0:7}) from ${GITHUB_REPOSITORY}"
            if git -C pages push -q --force-with-lease="gh-pages:${base}" origin snapshot:gh-pages; then
              echo "Published: ${MODE} ${dir}"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Could not publish the preview: other publishes kept changing gh-pages."
          exit 1

      - name: Comment preview URL on PR
        if: steps.deploy.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: https://preview.rustgis.app/pr-${{ github.event.pull_request.number }}/
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- docs-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n### 📖 Docs preview\n\n| Item | Value |\n| --- | --- |\n| Preview | ${url} |\n| Web app | ${url}app/ |\n| Commit | \`${process.env.HEAD_SHA.slice(0, 7)}\` |\n\nGitHub Pages takes a minute or two to publish a new commit.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # A closed (or merged) pull request's preview is removed.
  remove:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY != '' }}
    steps:
      - name: Configure the preview repository deploy key
        if: env.HAS_KEY == 'true'
        env:
          PREVIEW_DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_DEPLOY_KEY" > "$HOME/.ssh/rustgis-preview"
          chmod 600 "$HOME/.ssh/rustgis-preview"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove the preview
        if: env.HAS_KEY == 'true'
        env:
          MODE: remove
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/rustgis-preview -o IdentitiesOnly=yes
        run: *publish
