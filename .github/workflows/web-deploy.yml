# Publishes the browser app to the dedicated opengeos/rustgis-web GitHub Pages repository
# (https://web.rustgis.app) after every update to main. The hosting repository holds only the
# generated site; this workflow stays beside the source it builds.
#
# Required repository secret:
#   WEB_DEPLOY_KEY - private half of an SSH deploy key with write access to opengeos/rustgis-web
name: Deploy web.rustgis.app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build and publish (branch, tag, or SHA)
        default: main

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    if: github.repository == 'opengeos/RustGIS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Record the commit that was built
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build the web app
        run: |
          set -euo pipefail
          # Pinned Trunk release, checksum-verified, installed outside root-owned directories.
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin" trunk
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd apps/rustgis-web
          trunk build --release --public-url /

      - name: Prepare the site for GitHub Pages
        working-directory: dist/web
        run: |
          set -euo pipefail
          test -f index.html
          ls *_bg.wasm >/dev/null
          touch .nojekyll
          echo "web.rustgis.app" > CNAME
          oversized=$(find . -type f -size +104857600c -print)
          if [ -n "$oversized" ]; then
            echo "::error::A file exceeds GitHub Pages' 100 MB per-file limit: $oversized"
            exit 1
          fi
          echo "Built site: $(du -sh . | cut -f1)"

      - name: Configure the hosting repository deploy key
        env:
          WEB_DEPLOY_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_DEPLOY_KEY:-}" ]; then
            echo "::error::WEB_DEPLOY_KEY is not configured."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$WEB_DEPLOY_KEY" > "$HOME/.ssh/rustgis-web"
          chmod 600 "$HOME/.ssh/rustgis-web"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish an orphan snapshot
        working-directory: dist/web
        env:
          BUILT_SHA: ${{ steps.built.outputs.sha }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/rustgis-web -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${BUILT_SHA} from ${GITHUB_REPOSITORY}"
          # Parentless snapshots keep the hosting repository near the size of one build.
          git push -q --force git@github.com:opengeos/rustgis-web.git gh-pages
          echo "Published ${BUILT_SHA} to https://web.rustgis.app"
