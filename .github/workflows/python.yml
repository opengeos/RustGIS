name: Python package

# The `rustgis` package on PyPI (apps/rustgis-python): tested on every change to it or the
# engine; wheels for every platform built on each published release, attached to it and
# uploaded to PyPI with trusted publishing (the `pypi` environment, no token). The package's
# version is the workspace's, so each release's wheels carry its tag's version.
#
# Pull requests test on Linux only; macOS and Windows on main, by hand, for releases, and for a
# pull request labelled `ci:macos`, `ci:windows` or `ci:full` (adding the label runs just that
# platform; later pushes include it).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/rustgis-python/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  release:
    types: [published]
  workflow_dispatch:

# A new push to a pull request replaces its earlier run. Runs on main, by hand and for releases
# are never cancelled: a merge landing mid-build must not stop the wheels being built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || github.event.action == 'labeled' && github.event.label.name || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Whether the pull request asks for a platform: by the label just added, or (on a
          # push to it) by the labels it has.
          asks() {
            if [ "$ACTION" = labeled ]; then [ "$LABEL" = "$1" ] || [ "$LABEL" = ci:full ]
            else jq -e --arg l "$1" 'index($l) or index("ci:full")' <<<"$LABELS" >/dev/null; fi
          }
          runs=()
          # Adding a label runs only the platform it names.
          [ "$ACTION" = labeled ] || runs+=(ubuntu-latest:3.12 ubuntu-latest:3.13 ubuntu-latest:3.14)
          if [ "$EVENT" != pull_request ] || asks ci:macos; then runs+=(macos-latest:3.14); fi
          if [ "$EVENT" != pull_request ] || asks ci:windows; then runs+=(windows-latest:3.14); fi
          echo "include=$(jq -cn '$ARGS.positional | map(split(":") | {os: .[0], python: .[1]})' --args "${runs[@]}")" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.include != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./apps/rustgis-python[test,geopandas]"
      - name: Test
        working-directory: apps/rustgis-python
        run: python -m pytest -q

  wheels:
    name: Wheels (${{ matrix.platform.name }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64 }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: apps/rustgis-python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --out dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Each runner builds for its own architecture, so the wheel installs and runs here.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links apps/rustgis-python/dist rustgis
          python -c "import rustgis; s = rustgis.Session(sample=True); assert s.layers() and s.to_png(width=64, height=32)"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: apps/rustgis-python/dist

  # On every change too: the sdist carries the workspace crates it builds from, and a missing
  # one would otherwise only show at release time.
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: apps/rustgis-python
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and test from the sdist alone
        shell: bash
        run: |
          mkdir -p /tmp/sdist-check
          cp apps/rustgis-python/dist/*.tar.gz apps/rustgis-python/tests/test_session.py /tmp/sdist-check/
          cd /tmp/sdist-check
          # conda-forge and other repackagers need the license in the sdist.
          tar tzf ./*.tar.gz | grep '/apps/rustgis-python/LICENSE$' || { echo "::error::The sdist has no LICENSE file."; exit 1; }
          python -m pip install ./*.tar.gz pytest
          python -m pytest -q test_session.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: apps/rustgis-python/dist

  # The wheels and the sdist are attached to the GitHub release too, beside the app's packages.
  release-assets:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [test, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [test, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
