[alias]
xtask = "run -q -p xtask --"

[env]
# The `rustgis` Python module (apps/rustgis-python) is loaded by Python, which provides its
# symbols: never link it against libpython, so workspace builds need no Python development files.
PYO3_BUILD_EXTENSION_MODULE = "1"

# Link the C runtime into the Windows programs, so they start on a bare Windows install without
# the Visual C++ Redistributable (VCRUNTIME140.dll). A RUSTFLAGS environment variable replaces
# this (CI sets one), so release builds, which set none, are the ones it applies to.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
