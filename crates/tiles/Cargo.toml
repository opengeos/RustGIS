[package]
name = "rustgis-tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L2: web map tiles — XYZ/TMS/WMS raster tiles, Mapbox Vector Tiles, a subset of MapLibre styles, and their cache"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
tiny-skia = { workspace = true }
# Tiles are PNG, JPEG or WebP.
image = { workspace = true, features = ["jpeg", "webp"] }
# Vector tiles are sometimes served gzipped without saying so.
miniz_oxide = { workspace = true }

# Fetching tiles on worker threads. The browser fetches them itself (see `set_fetcher`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
