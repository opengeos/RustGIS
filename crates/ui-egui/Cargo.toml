[package]
name = "rustgis-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L6: the ribbon egui front end (ribbon, panes, map view); swappable"

[lints]
workspace = true

[dependencies]
rustgis-engine = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# The system's preferred interface languages (the browser's on the web).
sys-locale = { version = "0.3", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { workspace = true }
